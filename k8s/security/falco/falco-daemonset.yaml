apiVersion: v1
kind: Namespace
metadata:
  name: falco

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: falco
  namespace: falco

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: falco
rules:
  - apiGroups: [""]
    resources:
      - pods
      - namespaces
      - nodes
    verbs:
      - get
      - list
      - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: falco
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: falco
subjects:
  - kind: ServiceAccount
    name: falco
    namespace: falco

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: falco
  namespace: falco
spec:
  selector:
    matchLabels:
      app: falco
  template:
    metadata:
      labels:
        app: falco
    spec:
      serviceAccountName: falco
      hostPID: true
      hostNetwork: true

      tolerations:
        - operator: Exists

      containers:
        - name: falco
          image: falcosecurity/falco:latest

          securityContext:
            privileged: true

          args:
            - /usr/bin/falco

          env:
            - name: FALCO_K8S_API
              value: "https://kubernetes.default.svc"
            - name: FALCO_K8S_API_CERT
              value: "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
            - name: FALCO_K8S_API_TOKEN
              value: "/var/run/secrets/kubernetes.io/serviceaccount/token"

          volumeMounts:
            - name: dev-fs
              mountPath: /host/dev
            - name: proc-fs
              mountPath: /host/proc
            - name: boot-fs
              mountPath: /host/boot
              readOnly: true
            - name: lib-modules
              mountPath: /host/lib/modules
              readOnly: true
            - name: usr-fs
              mountPath: /host/usr
              readOnly: true

            # Service account token mount (for API access)
            - name: sa-token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true

      volumes:
        - name: dev-fs
          hostPath:
            path: /dev

        - name: proc-fs
          hostPath:
            path: /proc

        - name: boot-fs
          hostPath:
            path: /boot

        - name: lib-modules
          hostPath:
            path: /lib/modules

        - name: usr-fs
          hostPath:
            path: /usr

        - name: sa-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
